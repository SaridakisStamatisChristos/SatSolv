name: Jeroslow-Wang Startup A/B

on:
  push:
    branches: ['r7/search-jw-startup-ab']
    paths: ['.github/workflows/jw-startup-ab.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Build pinned drat-trim
        run: |
          git clone https://github.com/marijnheule/drat-trim.git /tmp/drat-trim
          git -C /tmp/drat-trim checkout 2e3b2dc0ecf938addbd779d42877b6ed69d9a985
          cc -O2 -DNDEBUG /tmp/drat-trim/drat-trim.c -o /tmp/drat-trim-bin
      - name: Select frozen frontier
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          wanted={'vmpc_28.shuffled-as.sat05-1957.cnf','DivS_568_11.cnf.sanitized.cnf','combined-crypto1-wff-seed-101-wffvars-500-cryptocplx-31-overlap-2.cnf','brent_69_0.05.cnf','SAT_dat.k10.cnf','rand_net70-40-10.shuffled.cnf','mchess16-mixed-35percent-blocked.cnf','posixpath__joinrealpath_13.cnf','or_randxor_k3_n520_m520.cnf'}
          src=json.loads(Path('benchmarks/competition_manifest.json').read_text()); rows=[x for x in src['instances'] if x['name'] in wanted]
          if len(rows)!=9: raise SystemExit('frontier incomplete')
          Path('/tmp/frontier.json').write_text(json.dumps({'count':9,'instances':rows},indent=2)+'\n')
          PY
      - name: Fetch inputs
        run: python3 tools/fetch_benchmarks.py --manifest /tmp/frontier.json --dest benchmarks/cache
      - name: Build baseline and JW candidate
        run: |
          git worktree add --detach /tmp/base "$GITHUB_SHA"
          git worktree add --detach /tmp/jw "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/jw/src/solver.cpp'); s=p.read_text()
          start='''    start_time_ = std::chrono::steady_clock::now();\n\n    for (const auto& clause : formula.clauses) {\n        const int cid = add_clause(clause, false);\n        if (cid >= 0) {\n            for (int lit : clauses_[static_cast<std::size_t>(cid)].lits) {\n                const int v = var(lit);\n                activity_[static_cast<std::size_t>(v)] += 1.0;\n            }\n        }'''
          repl='''    start_time_ = std::chrono::steady_clock::now();\n\n    std::vector<double> jw_pos(static_cast<std::size_t>(nvars_ + 1), 0.0);\n    std::vector<double> jw_neg(static_cast<std::size_t>(nvars_ + 1), 0.0);\n    for (const auto& clause : formula.clauses) {\n        const double weight = std::ldexp(1.0, -std::min<int>(static_cast<int>(clause.size()), 1022));\n        for (int lit : clause) {\n            auto& score = lit > 0 ? jw_pos[static_cast<std::size_t>(var(lit))] : jw_neg[static_cast<std::size_t>(var(lit))];\n            score += weight;\n        }\n    }\n    for (int v = 1; v <= nvars_; ++v) {\n        activity_[static_cast<std::size_t>(v)] = jw_pos[static_cast<std::size_t>(v)] + jw_neg[static_cast<std::size_t>(v)];\n        saved_phase_[static_cast<std::size_t>(v)] = static_cast<std::int8_t>(jw_pos[static_cast<std::size_t>(v)] >= jw_neg[static_cast<std::size_t>(v)] ? 1 : 0);\n    }\n\n    for (const auto& clause : formula.clauses) {\n        add_clause(clause, false);'''
          if start not in s: raise SystemExit('startup anchor missing')
          p.write_text(s.replace(start,repl,1))
          PY
          for d in /tmp/base /tmp/jw; do cmake -S "$d" -B "$d/build" -DCMAKE_BUILD_TYPE=Release; cmake --build "$d/build" -j2; ctest --test-dir "$d/build" --output-on-failure; done
      - name: Run certified A/B
        run: |
          mkdir -p benchmarks/results/jw-startup-ab
          for mode in base jw; do python3 tools/benchmark.py --manifest /tmp/frontier.json --root benchmarks/cache --satsolv "/tmp/${mode}/build/satsolv" --drat-trim /tmp/drat-trim-bin --time-limit 15 --verification-time-limit 180 --memory-gib 4 --output "benchmarks/results/jw-startup-ab/${mode}.json"; done
      - name: Compare
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for m in ('base','jw'):
            d=json.loads(Path(f'benchmarks/results/jw-startup-ab/{m}.json').read_text())
            if not d['certification']['passed']: raise SystemExit(f'{m} certification failed')
            print(m,d['summary']['satsolv'])
            for r in d['rows']:
              x=r['solvers']['satsolv']; print(m,r['instance'],x['result'],round(x['elapsed'],3),x.get('verified'))
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jw-startup-ab-evidence
          path: benchmarks/results/jw-startup-ab/*.json
          if-no-files-found: error
