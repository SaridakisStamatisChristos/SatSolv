name: Initial Phase A/B

on:
  push:
    branches: ['r7/search-phase-sweep']
    paths:
      - .github/workflows/phase-sweep.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build pinned drat-trim
        run: |
          git clone https://github.com/marijnheule/drat-trim.git /tmp/drat-trim
          git -C /tmp/drat-trim checkout 2e3b2dc0ecf938addbd779d42877b6ed69d9a985
          cc -O2 -DNDEBUG /tmp/drat-trim/drat-trim.c -o /tmp/drat-trim-bin

      - name: Select frozen frontier corpus
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          wanted = {
              'vmpc_28.shuffled-as.sat05-1957.cnf',
              'DivS_568_11.cnf.sanitized.cnf',
              'combined-crypto1-wff-seed-101-wffvars-500-cryptocplx-31-overlap-2.cnf',
              'brent_69_0.05.cnf',
              'SAT_dat.k10.cnf',
              'rand_net70-40-10.shuffled.cnf',
              'mchess16-mixed-35percent-blocked.cnf',
              'posixpath__joinrealpath_13.cnf',
              'or_randxor_k3_n520_m520.cnf',
          }
          src = json.loads(Path('benchmarks/competition_manifest.json').read_text())
          rows = [x for x in src['instances'] if x['name'] in wanted]
          if len(rows) != len(wanted): raise SystemExit('frontier manifest incomplete')
          Path('/tmp/frontier.json').write_text(json.dumps({'count':len(rows),'instances':rows},indent=2)+'\n')
          PY
      - name: Fetch and hash-check inputs
        run: python3 tools/fetch_benchmarks.py --manifest /tmp/frontier.json --dest benchmarks/cache

      - name: Build positive and negative initial phases
        run: |
          git worktree add --detach /tmp/positive "$GITHUB_SHA"
          git worktree add --detach /tmp/negative "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/negative/src/solver.cpp')
          s=p.read_text()
          old='saved_phase_.assign(static_cast<std::size_t>(variables + 1), static_cast<std::int8_t>(1));'
          new='saved_phase_.assign(static_cast<std::size_t>(variables + 1), static_cast<std::int8_t>(0));'
          if old not in s: raise SystemExit('phase anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
          for d in /tmp/positive /tmp/negative; do
            cmake -S "$d" -B "$d/build" -DCMAKE_BUILD_TYPE=Release
            cmake --build "$d/build" -j2
          done

      - name: Run certified A/B
        run: |
          mkdir -p benchmarks/results/phase-ab
          for mode in positive negative; do
            python3 tools/benchmark.py \
              --manifest /tmp/frontier.json \
              --root benchmarks/cache \
              --satsolv "/tmp/${mode}/build/satsolv" \
              --drat-trim /tmp/drat-trim-bin \
              --time-limit 15 \
              --verification-time-limit 180 \
              --memory-gib 4 \
              --output "benchmarks/results/phase-ab/${mode}.json"
          done

      - name: Compare
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          ds={m:json.loads(Path(f'benchmarks/results/phase-ab/{m}.json').read_text()) for m in ('positive','negative')}
          for m,d in ds.items():
              if not d['certification']['passed']: raise SystemExit(f'{m} certification failed')
              s=d['summary']['satsolv']
              conf=sum(int(r['solvers']['satsolv'].get('stats',{}).get('conflicts',0)) for r in d['rows'])
              secs=sum(float(r['solvers']['satsolv'].get('stats',{}).get('solve_seconds',r['solvers']['satsolv']['elapsed'])) for r in d['rows'])
              print(f'{m}: solved={s["solved"]} par2={s["par2"]:.6f} conflicts_per_second={conf/max(secs,1e-9):.1f}')
          b={r['instance']:r['solvers']['satsolv'] for r in ds['positive']['rows']}
          c={r['instance']:r['solvers']['satsolv'] for r in ds['negative']['rows']}
          print('per-cell:')
          for n in sorted(b): print(f'{n}: positive={b[n]["result"]}/{b[n]["elapsed"]:.3f}s negative={c[n]["result"]}/{c[n]["elapsed"]:.3f}s')
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-ab-evidence
          path: benchmarks/results/phase-ab/*.json
          if-no-files-found: error
