name: Recursive Minimization A/B

on:
  push:
    branches: ['r7/search-recursive-minimization']
    paths: ['.github/workflows/recursive-minimization-ab.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Build pinned drat-trim
        run: |
          git clone https://github.com/marijnheule/drat-trim.git /tmp/drat-trim
          git -C /tmp/drat-trim checkout 2e3b2dc0ecf938addbd779d42877b6ed69d9a985
          cc -O2 -DNDEBUG /tmp/drat-trim/drat-trim.c -o /tmp/drat-trim-bin
      - name: Select hard UNSAT corpus
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          wanted={'SAT_dat.k10.cnf','rand_net70-40-10.shuffled.cnf','mchess16-mixed-35percent-blocked.cnf','posixpath__joinrealpath_13.cnf','or_randxor_k3_n520_m520.cnf','clqcolor-08-06-07.shuffled-as.sat05-1257.cnf'}
          src=json.loads(Path('benchmarks/competition_manifest.json').read_text()); rows=[x for x in src['instances'] if x['name'] in wanted]
          if len(rows)!=6: raise SystemExit('UNSAT corpus incomplete')
          Path('/tmp/unsat.json').write_text(json.dumps({'count':6,'instances':rows},indent=2)+'\n')
          PY
      - name: Fetch inputs
        run: python3 tools/fetch_benchmarks.py --manifest /tmp/unsat.json --dest benchmarks/cache
      - name: Build baseline and recursive candidate
        run: |
          git worktree add --detach /tmp/base "$GITHUB_SHA"
          git worktree add --detach /tmp/recursive "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/recursive/src/solver.cpp'); s=p.read_text()
          if '#include <functional>' not in s:
              s=s.replace('#include <cmath>\n','#include <cmath>\n#include <functional>\n',1)
          old='''void Solver::minimize_clause(std::vector<int>& clause) {\n    if (clause.size() <= 2) return;\n    std::unordered_set<int> present(clause.begin(), clause.end());\n    std::vector<int> kept;\n    kept.reserve(clause.size());\n    kept.push_back(clause[0]);\n\n    for (std::size_t i = 1; i < clause.size(); ++i) {\n        const int q = clause[i];\n        const int v = var(q);\n        const int rid = reasons_[static_cast<std::size_t>(v)];\n        bool removable = rid >= 0;\n        if (removable) {\n            const Clause& reason = clauses_[static_cast<std::size_t>(rid)];\n            const int assigned_lit = assigns_[static_cast<std::size_t>(v)] == 1 ? v : -v;\n            bool found_pivot = false;\n            for (int r : reason.lits) {\n                if (r == assigned_lit) {\n                    found_pivot = true;\n                    continue;\n                }\n                if (present.find(r) == present.end()) {\n                    removable = false;\n                    break;\n                }\n            }\n            removable = removable && found_pivot;\n        }\n        if (removable) {\n            present.erase(q);\n        } else {\n            kept.push_back(q);\n        }\n    }\n    clause.swap(kept);\n}'''
          new='''void Solver::minimize_clause(std::vector<int>& clause) {\n    if (clause.size() <= 2) return;\n    std::unordered_set<int> present(clause.begin(), clause.end());\n    std::unordered_set<int> proven_redundant;\n    std::vector<int> kept;\n    kept.reserve(clause.size());\n    kept.push_back(clause[0]);\n\n    std::function<bool(int, std::unordered_set<int>&)> redundant =\n        [&](int variable, std::unordered_set<int>& active) -> bool {\n            if (proven_redundant.find(variable) != proven_redundant.end()) return true;\n            const int rid = reasons_[static_cast<std::size_t>(variable)];\n            if (rid < 0) return false;\n            if (!active.insert(variable).second) return true;\n            const Clause& reason = clauses_[static_cast<std::size_t>(rid)];\n            const int assigned_lit = assigns_[static_cast<std::size_t>(variable)] == 1 ? variable : -variable;\n            bool found_pivot = false;\n            for (int r : reason.lits) {\n                if (r == assigned_lit) { found_pivot = true; continue; }\n                const int rv = var(r);\n                if (levels_[static_cast<std::size_t>(rv)] == 0) continue;\n                if (present.find(r) != present.end()) continue;\n                if (!redundant(rv, active)) { active.erase(variable); return false; }\n            }\n            active.erase(variable);\n            if (!found_pivot) return false;\n            proven_redundant.insert(variable);\n            return true;\n        };\n\n    for (std::size_t i = 1; i < clause.size(); ++i) {\n        const int q = clause[i];\n        std::unordered_set<int> active;\n        const bool removable = redundant(var(q), active);\n        if (removable) present.erase(q);\n        else kept.push_back(q);\n    }\n    clause.swap(kept);\n}'''
          if old not in s: raise SystemExit('minimization anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
          for d in /tmp/base /tmp/recursive; do
            cmake -S "$d" -B "$d/build" -DCMAKE_BUILD_TYPE=Release
            cmake --build "$d/build" -j2
            ctest --test-dir "$d/build" --output-on-failure
          done
      - name: Run certified A/B
        run: |
          mkdir -p benchmarks/results/recursive-minimization-ab
          for mode in base recursive; do python3 tools/benchmark.py --manifest /tmp/unsat.json --root benchmarks/cache --satsolv "/tmp/${mode}/build/satsolv" --drat-trim /tmp/drat-trim-bin --time-limit 15 --verification-time-limit 180 --memory-gib 4 --output "benchmarks/results/recursive-minimization-ab/${mode}.json"; done
      - name: Compare
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          ds={m:json.loads(Path(f'benchmarks/results/recursive-minimization-ab/{m}.json').read_text()) for m in ('base','recursive')}
          for m,d in ds.items():
            if not d['certification']['passed']: raise SystemExit(f'{m} certification failed: {d["certification"]["violations"]}')
            conf=sum(int(r['solvers']['satsolv'].get('stats',{}).get('conflicts',0)) for r in d['rows']); sec=sum(float(r['solvers']['satsolv'].get('stats',{}).get('solve_seconds',r['solvers']['satsolv']['elapsed'])) for r in d['rows']); print(m,d['summary']['satsolv'],'conflicts_s',conf/max(sec,1e-9))
          for r in ds['recursive']['rows']:
            x=r['solvers']['satsolv']; print(r['instance'],x['result'],round(x['elapsed'],3),x.get('verified'),x.get('stats',{}).get('conflicts'))
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recursive-minimization-ab-evidence
          path: benchmarks/results/recursive-minimization-ab/*.json
          if-no-files-found: error
