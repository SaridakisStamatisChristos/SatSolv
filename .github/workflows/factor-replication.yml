name: Replicate factoring diagnostic on Kissat-only UNSAT families

on:
  pull_request:
    paths:
      - .github/workflows/factor-replication.yml
      - tools/kissat_mechanism_screen.py
      - benchmarks/competition_manifest.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replicate:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: register-allocation
            instance: posixpath__joinrealpath_13.cnf
          - tag: mutilated-chessboard
            instance: mchess16-mixed-35percent-blocked.cnf
    env:
      MANIFEST_SHA256: 7ef151bdfce7cd0344e27643446f2509823b43432a64292661a6de86ceb26a53
      KISSAT_COMMIT: 8af8e56f174b778aef3aa45af9f739b2a5f492c2
      DRAT_TRIM_COMMIT: 2e3b2dc0ecf938addbd779d42877b6ed69d9a985
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen parent manifest
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$MANIFEST_SHA256" benchmarks/competition_manifest.json | sha256sum --check --strict
      - name: Test read-only diagnosis and correctness contracts
        run: |
          python3 -m unittest discover -s tests -p test_kissat_mechanism_screen.py -v
          python3 -m py_compile tools/kissat_mechanism_screen.py
      - name: Build pinned Kissat
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/arminbiere/kissat.git /tmp/kissat
          git -C /tmp/kissat checkout "$KISSAT_COMMIT"
          cd /tmp/kissat
          ./configure
          make -j2
      - name: Build independently pinned proof checker
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/marijnheule/drat-trim.git /tmp/drat-trim
          git -C /tmp/drat-trim checkout "$DRAT_TRIM_COMMIT"
          cc -O2 -DNDEBUG /tmp/drat-trim/drat-trim.c -o /tmp/drat-trim-bin
      - name: Fetch SHA-verified competition inputs
        run: python3 tools/fetch_benchmarks.py --manifest benchmarks/competition_manifest.json --dest benchmarks/cache
      - name: Run same-option independent-gadget/factoring screen
        run: |
          python3 tools/kissat_mechanism_screen.py \
            --manifest benchmarks/competition_manifest.json \
            --root benchmarks/cache \
            --kissat /tmp/kissat/build/kissat \
            --drat-trim /tmp/drat-trim-bin \
            --instance "${{ matrix.instance }}" \
            --time-limit 60 --verification-time-limit 300 --memory-gib 4 \
            --output "benchmarks/results/factor-replication-v1/${{ matrix.tag }}.json"
      - name: Preserve raw evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factoring-${{ matrix.tag }}-evidence
          path: benchmarks/results/factor-replication-v1/*.json
          if-no-files-found: warn

# Same 7-arm fingerprint is exploratory; a pass is not proof of factoring as
# the sole cause and does not authorize an algorithm or superiority claim.
