name: Mechanism fingerprint v1 — pinned Kissat ablations

on:
  pull_request:
    paths:
      - tools/kissat_mechanism_screen.py
      - tests/test_kissat_mechanism_screen.py
      - .github/workflows/mechanism-fingerprint.yml
      - benchmarks/competition_manifest.json
      - tools/benchmark.py
      - tools/fetch_benchmarks.py
      - docs/mechanism-fingerprint.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MANIFEST_SHA256: 7ef151bdfce7cd0344e27643446f2509823b43432a64292661a6de86ceb26a53
      KISSAT_COMMIT: 8af8e56f174b778aef3aa45af9f739b2a5f492c2
      DRAT_TRIM_COMMIT: 2e3b2dc0ecf938addbd779d42877b6ed69d9a985
    steps:
      - uses: actions/checkout@v4
      - name: Assert frozen benchmark manifest
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$MANIFEST_SHA256" benchmarks/competition_manifest.json | sha256sum --check --strict
      - name: Validate diagnostic source and adversarial gadget tests
        run: |
          python3 -m py_compile tools/kissat_mechanism_screen.py
          python3 -m unittest discover -s tests -p test_kissat_mechanism_screen.py -v
      - name: Build unchanged SatSolv and run native regression suite
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSATSOLV_WARNINGS_AS_ERRORS=ON
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
      - name: Build source-pinned Kissat comparator
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/arminbiere/kissat.git /tmp/kissat
          git -C /tmp/kissat checkout "$KISSAT_COMMIT"
          cd /tmp/kissat
          ./configure
          make -j2
      - name: Build independent DRAT verifier
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/marijnheule/drat-trim.git /tmp/drat-trim
          git -C /tmp/drat-trim checkout "$DRAT_TRIM_COMMIT"
          cc -O2 -DNDEBUG /tmp/drat-trim/drat-trim.c -o /tmp/drat-trim-bin
      - name: Fetch and SHA-256-check frozen benchmark inputs
        run: python3 tools/fetch_benchmarks.py --manifest benchmarks/competition_manifest.json --dest benchmarks/cache
      - name: Run proof-certified seven-arm mechanism screen
        run: |
          python3 tools/kissat_mechanism_screen.py \
            --manifest benchmarks/competition_manifest.json \
            --root benchmarks/cache \
            --kissat /tmp/kissat/build/kissat \
            --drat-trim /tmp/drat-trim-bin \
            --instance or_randxor_k3_n520_m520.cnf \
            --time-limit 60 --verification-time-limit 300 --memory-gib 4 \
            --output benchmarks/results/mechanism-fingerprint-v1/result.json
      - name: Preserve diagnostic evidence even if any arm fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kissat-mechanism-fingerprint-v1-evidence
          path: benchmarks/results/mechanism-fingerprint-v1/result.json
          if-no-files-found: warn

# Passing means the investigation was executed and integrity-checked.
# It does NOT claim the XOR mechanism is causal, or that SatSolv improved.
