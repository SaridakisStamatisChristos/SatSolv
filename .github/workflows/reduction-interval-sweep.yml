name: Learnt Reduction Interval Sweep

on:
  push:
    branches: ['r7/search-reduction-interval-sweep']
    paths: ['.github/workflows/reduction-interval-sweep.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Build pinned drat-trim
        run: |
          git clone https://github.com/marijnheule/drat-trim.git /tmp/drat-trim
          git -C /tmp/drat-trim checkout 2e3b2dc0ecf938addbd779d42877b6ed69d9a985
          cc -O2 -DNDEBUG /tmp/drat-trim/drat-trim.c -o /tmp/drat-trim-bin
      - name: Select hard UNSAT frontier
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          wanted={'SAT_dat.k10.cnf','rand_net70-40-10.shuffled.cnf','mchess16-mixed-35percent-blocked.cnf','posixpath__joinrealpath_13.cnf','or_randxor_k3_n520_m520.cnf','clqcolor-08-06-07.shuffled-as.sat05-1257.cnf'}
          src=json.loads(Path('benchmarks/competition_manifest.json').read_text()); rows=[x for x in src['instances'] if x['name'] in wanted]
          if len(rows)!=6: raise SystemExit('UNSAT corpus incomplete')
          Path('/tmp/unsat.json').write_text(json.dumps({'count':6,'instances':rows},indent=2)+'\n')
          PY
      - name: Fetch inputs
        run: python3 tools/fetch_benchmarks.py --manifest /tmp/unsat.json --dest benchmarks/cache
      - name: Build interval variants
        run: |
          for interval in 1000 2000 5000 10000; do
            d="/tmp/r${interval}"
            git worktree add --detach "$d" "$GITHUB_SHA"
            python3 - "$d/include/satsolv/solver.hpp" "$interval" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]); val=sys.argv[2]; s=p.read_text(); old='int reduce_interval = 2000;'
          if old not in s: raise SystemExit('reduction interval anchor missing')
          p.write_text(s.replace(old,f'int reduce_interval = {val};',1))
          PY
            cmake -S "$d" -B "$d/build" -DCMAKE_BUILD_TYPE=Release
            cmake --build "$d/build" -j2
          done
      - name: Run certified sweep
        run: |
          mkdir -p benchmarks/results/reduction-interval
          for interval in 1000 2000 5000 10000; do
            python3 tools/benchmark.py --manifest /tmp/unsat.json --root benchmarks/cache --satsolv "/tmp/r${interval}/build/satsolv" --drat-trim /tmp/drat-trim-bin --time-limit 15 --verification-time-limit 180 --memory-gib 4 --output "benchmarks/results/reduction-interval/r${interval}.json"
          done
      - name: Compare
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for v in (1000,2000,5000,10000):
            d=json.loads(Path(f'benchmarks/results/reduction-interval/r{v}.json').read_text())
            if not d['certification']['passed']: raise SystemExit(f'r{v} certification failed')
            s=d['summary']['satsolv']; conf=sum(int(r['solvers']['satsolv'].get('stats',{}).get('conflicts',0)) for r in d['rows']); sec=sum(float(r['solvers']['satsolv'].get('stats',{}).get('solve_seconds',r['solvers']['satsolv']['elapsed'])) for r in d['rows']); deleted=sum(int(r['solvers']['satsolv'].get('stats',{}).get('deleted_learnt_clauses',0)) for r in d['rows']); print(f'interval={v} solved={s["solved"]} par2={s["par2"]:.6f} conflicts_s={conf/max(sec,1e-9):.1f} deleted={deleted}')
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reduction-interval-sweep-evidence
          path: benchmarks/results/reduction-interval/*.json
          if-no-files-found: error
