name: Conflict-Only EVSIDS Retain+Gain Gate

on:
  push:
    branches: ['r7/search-activity-seed-ab']
    paths: ['.github/workflows/activity-seed-retain-gain.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Build conflict-only candidate
        run: |
          git worktree add --detach /tmp/candidate "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/candidate/src/solver.cpp'); s=p.read_text()
          old='''        const int cid = add_clause(clause, false);\n        if (cid >= 0) {\n            for (int lit : clauses_[static_cast<std::size_t>(cid)].lits) {\n                const int v = var(lit);\n                activity_[static_cast<std::size_t>(v)] += 1.0;\n            }\n        }'''
          if old not in s: raise SystemExit('activity anchor missing')
          p.write_text(s.replace(old,'        add_clause(clause, false);',1))
          PY
          cmake -S /tmp/candidate -B /tmp/candidate/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/candidate/build -j2
      - name: Build pinned drat-trim
        run: |
          git clone https://github.com/marijnheule/drat-trim.git /tmp/drat-trim
          git -C /tmp/drat-trim checkout 2e3b2dc0ecf938addbd779d42877b6ed69d9a985
          cc -O2 -DNDEBUG /tmp/drat-trim/drat-trim.c -o /tmp/drat-trim-bin
      - name: Select retain+gain corpus
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          wanted={
            'ibm-2004-03-k70.cnf','rbsat-v760c43649gyes10.cnf','c499_gr_2pin_w6.shuffled.cnf',
            'PRP_30_35.cnf','ferry8_ks99i.renamed-as.sat05-4005.cnf','iso-ukn004.shuffled-as.sat05-3385.cnf',
            'clqcolor-08-06-07.shuffled-as.sat05-1257.cnf','vmpc_28.shuffled-as.sat05-1957.cnf'}
          src=json.loads(Path('benchmarks/competition_manifest.json').read_text()); rows=[x for x in src['instances'] if x['name'] in wanted]
          if len(rows)!=8: raise SystemExit('retain+gain corpus incomplete')
          Path('/tmp/retain-gain.json').write_text(json.dumps({'count':8,'instances':rows},indent=2)+'\n')
          PY
      - name: Fetch and hash-check inputs
        run: python3 tools/fetch_benchmarks.py --manifest /tmp/retain-gain.json --dest benchmarks/cache
      - name: Run certified candidate
        run: python3 tools/benchmark.py --manifest /tmp/retain-gain.json --root benchmarks/cache --satsolv /tmp/candidate/build/satsolv --drat-trim /tmp/drat-trim-bin --time-limit 60 --verification-time-limit 300 --memory-gib 4 --output benchmarks/results/retain-gain.json
      - name: Enforce all eight solved and verified
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmarks/results/retain-gain.json').read_text())
          if not d['certification']['passed']: raise SystemExit(d['certification']['violations'])
          bad=[]
          for r in d['rows']:
            x=r['solvers']['satsolv']; print(r['instance'],x['result'],x['elapsed'],x.get('verified'))
            if x['result'] not in ('SAT','UNSAT') or not x.get('verified'): bad.append(r['instance'])
          if bad: raise SystemExit(f'retain+gain failures: {bad}')
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conflict-only-retain-gain-evidence
          path: benchmarks/results/retain-gain.json
          if-no-files-found: error
