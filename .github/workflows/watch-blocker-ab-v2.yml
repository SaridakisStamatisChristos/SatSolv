name: Watch Blocker A/B v2

on:
  push:
    branches: ['r7/perf-watch-blocker-probe']
    paths:
      - .github/workflows/watch-blocker-ab-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build pinned drat-trim
        run: |
          git clone https://github.com/marijnheule/drat-trim.git /tmp/drat-trim
          git -C /tmp/drat-trim checkout 2e3b2dc0ecf938addbd779d42877b6ed69d9a985
          cc -O2 -DNDEBUG /tmp/drat-trim/drat-trim.c -o /tmp/drat-trim-bin
      - name: Select propagation-heavy diagnostic corpus
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          wanted={'stb_792_333.apx_1_DS-ST.cnf','brent_69_0.05.cnf','32_0.cnf','spg_420_280.cnf','SAT_dat.k10.cnf','rand_net70-40-10.shuffled.cnf','grs-32-160.cnf','sat-bench-trig-taylor4.cnf','minxor128.cnf'}
          src=json.loads(Path('benchmarks/competition_manifest.json').read_text())
          rows=[x for x in src['instances'] if x['name'] in wanted]
          if len(rows)!=len(wanted): raise SystemExit('diagnostic corpus incomplete')
          Path('/tmp/bcp.json').write_text(json.dumps({'count':len(rows),'instances':rows},indent=2)+'\n')
          PY
      - name: Fetch and hash-check inputs
        run: python3 tools/fetch_benchmarks.py --manifest /tmp/bcp.json --dest benchmarks/cache
      - name: Build baseline and blocker candidate
        run: |
          git worktree add --detach /tmp/base "$GITHUB_SHA"
          git worktree add --detach /tmp/candidate "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import base64
          hp=Path('/tmp/candidate/include/satsolv/solver.hpp')
          h=hp.read_text()
          h=h.replace('    struct HeapEntry {\n','    struct Watcher {\n        int clause = -1;\n        int blocker = 0;\n    };\n\n    struct HeapEntry {\n',1)
          old='    std::vector<std::vector<int>> watches_;'
          if old not in h: raise SystemExit('header watches anchor missing')
          h=h.replace(old,'    std::vector<std::vector<Watcher>> watches_;',1)
          hp.write_text(h)
          sp=Path('/tmp/candidate/src/solver.cpp')
          s=sp.read_text()
          old_add='    watches_[static_cast<std::size_t>(lit_index(c.lits[0]))].push_back(cid);\n    watches_[static_cast<std::size_t>(lit_index(c.lits[1]))].push_back(cid);'
          new_add='    watches_[static_cast<std::size_t>(lit_index(c.lits[0]))].push_back(Watcher{cid, c.lits[1]});\n    watches_[static_cast<std::size_t>(lit_index(c.lits[1]))].push_back(Watcher{cid, c.lits[0]});'
          if old_add not in s: raise SystemExit('watch insertion anchor missing')
          s=s.replace(old_add,new_add,1)
          start=s.index('int Solver::propagate() {'); end=s.index('\nvoid Solver::cancel_until',start)
          enc=''
          prop=base64.b64decode(enc).decode()
          sp.write_text(s[:start]+prop+s[end:])
          PY
          for d in /tmp/base /tmp/candidate; do
            cmake -S "$d" -B "$d/build" -DCMAKE_BUILD_TYPE=Release
            cmake --build "$d/build" -j2
            ctest --test-dir "$d/build" --output-on-failure
          done
      - name: Run certified BCP A/B
        run: |
          mkdir -p benchmarks/results/watch-blocker-ab-v2
          for mode in base candidate; do
            python3 tools/benchmark.py --manifest /tmp/bcp.json --root benchmarks/cache --satsolv "/tmp/${mode}/build/satsolv" --drat-trim /tmp/drat-trim-bin --time-limit 12 --verification-time-limit 180 --memory-gib 4 --output "benchmarks/results/watch-blocker-ab-v2/${mode}.json"
          done
      - name: Compare throughput
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          ds={m:json.loads(Path(f'benchmarks/results/watch-blocker-ab-v2/{m}.json').read_text()) for m in ('base','candidate')}
          for m,d in ds.items():
            if not d['certification']['passed']: raise SystemExit(f'{m} certification failed')
          for m,d in ds.items():
            conf=sum(int(r['solvers']['satsolv'].get('stats',{}).get('conflicts',0)) for r in d['rows']); prop=sum(int(r['solvers']['satsolv'].get('stats',{}).get('propagations',0)) for r in d['rows']); sec=sum(float(r['solvers']['satsolv'].get('stats',{}).get('solve_seconds',r['solvers']['satsolv']['elapsed'])) for r in d['rows']); s=d['summary']['satsolv']; print(f'{m}: solved={s["solved"]} par2={s["par2"]:.6f} conflicts_s={conf/max(sec,1e-9):.1f} propagations_s={prop/max(sec,1e-9):.1f}')
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watch-blocker-ab-v2-evidence
          path: benchmarks/results/watch-blocker-ab-v2/*.json
          if-no-files-found: error
