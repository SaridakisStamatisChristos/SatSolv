name: Materialize Majority Phase Product

on:
  push:
    branches: ['r7/perf-majority-phase-product']
    paths: ['.github/workflows/materialize-majority-phase.yml']

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: r7/perf-majority-phase-product
      - name: Apply majority-literal initial phase
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/solver.cpp')
          s=p.read_text()
          anchor='''    start_time_ = std::chrono::steady_clock::now();\n\n    for (const auto& clause : formula.clauses) {'''
          repl='''    start_time_ = std::chrono::steady_clock::now();\n\n    // Seed only the initial decision polarity from the formula. Phase saving takes over\n    // immediately after assignments begin, so this is a deterministic startup hint only.\n    std::vector<int> polarity_score(static_cast<std::size_t>(nvars_ + 1), 0);\n    for (const auto& clause : formula.clauses) {\n        for (int lit : clause) {\n            polarity_score[static_cast<std::size_t>(var(lit))] += lit > 0 ? 1 : -1;\n        }\n    }\n    for (int v = 1; v <= nvars_; ++v) {\n        saved_phase_[static_cast<std::size_t>(v)] =\n            static_cast<std::int8_t>(polarity_score[static_cast<std::size_t>(v)] >= 0 ? 1 : 0);\n    }\n\n    for (const auto& clause : formula.clauses) {'''
          if anchor not in s:
              raise SystemExit('majority-phase anchor missing or already applied')
          p.write_text(s.replace(anchor,repl,1))
          PY
      - name: Commit exact product code
        run: |
          git config user.name 'SatSolv R7 Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/solver.cpp
          git commit -m 'perf: seed initial phase from literal majority'
          git push origin HEAD:r7/perf-majority-phase-product
