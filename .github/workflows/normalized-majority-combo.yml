name: Normalized Activity + Majority Phase

on:
  push:
    branches: ['r7/search-normalized-majority-combo']
    paths: ['.github/workflows/normalized-majority-combo.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Build combo candidate
        run: |
          git worktree add --detach /tmp/combo "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/combo/src/solver.cpp'); s=p.read_text()
          # Majority-literal initial polarity.
          anchor='''    start_time_ = std::chrono::steady_clock::now();\n\n    for (const auto& clause : formula.clauses) {'''
          repl='''    start_time_ = std::chrono::steady_clock::now();\n\n    std::vector<int> polarity_score(static_cast<std::size_t>(nvars_ + 1), 0);\n    for (const auto& clause : formula.clauses) {\n        for (int lit : clause) polarity_score[static_cast<std::size_t>(var(lit))] += lit > 0 ? 1 : -1;\n    }\n    for (int v = 1; v <= nvars_; ++v) saved_phase_[static_cast<std::size_t>(v)] = static_cast<std::int8_t>(polarity_score[static_cast<std::size_t>(v)] >= 0 ? 1 : 0);\n\n    for (const auto& clause : formula.clauses) {'''
          if anchor not in s: raise SystemExit('phase anchor missing')
          s=s.replace(anchor,repl,1)
          # Preserve occurrence ordering but scale the startup prior to [0,1].
          anchor='''    // Loading-time activity is occurrence based. Rebuild once from final scores instead of\n    // retaining one stale priority-queue entry per literal occurrence.\n    order_heap_ = {};'''
          repl='''    double max_initial_activity = 0.0;\n    for (int v = 1; v <= nvars_; ++v) max_initial_activity = std::max(max_initial_activity, activity_[static_cast<std::size_t>(v)]);\n    if (max_initial_activity > 0.0) {\n        for (int v = 1; v <= nvars_; ++v) activity_[static_cast<std::size_t>(v)] /= max_initial_activity;\n    }\n\n    // Preserve occurrence-based initial ordering while letting conflict EVSIDS dominate quickly.\n    order_heap_ = {};'''
          if anchor not in s: raise SystemExit('activity normalization anchor missing')
          p.write_text(s.replace(anchor,repl,1))
          PY
          cmake -S /tmp/combo -B /tmp/combo/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/combo/build -j2
          ctest --test-dir /tmp/combo/build --output-on-failure
      - name: Build pinned drat-trim
        run: |
          git clone https://github.com/marijnheule/drat-trim.git /tmp/drat-trim
          git -C /tmp/drat-trim checkout 2e3b2dc0ecf938addbd779d42877b6ed69d9a985
          cc -O2 -DNDEBUG /tmp/drat-trim/drat-trim.c -o /tmp/drat-trim-bin
      - name: Select frontier plus PRP sentinel
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          wanted={'vmpc_28.shuffled-as.sat05-1957.cnf','DivS_568_11.cnf.sanitized.cnf','combined-crypto1-wff-seed-101-wffvars-500-cryptocplx-31-overlap-2.cnf','brent_69_0.05.cnf','SAT_dat.k10.cnf','rand_net70-40-10.shuffled.cnf','mchess16-mixed-35percent-blocked.cnf','posixpath__joinrealpath_13.cnf','or_randxor_k3_n520_m520.cnf','PRP_30_35.cnf'}
          src=json.loads(Path('benchmarks/competition_manifest.json').read_text()); rows=[x for x in src['instances'] if x['name'] in wanted]
          if len(rows)!=10: raise SystemExit('diagnostic corpus incomplete')
          Path('/tmp/corpus.json').write_text(json.dumps({'count':10,'instances':rows},indent=2)+'\n')
          PY
      - name: Fetch inputs
        run: python3 tools/fetch_benchmarks.py --manifest /tmp/corpus.json --dest benchmarks/cache
      - name: Run certified combo
        run: python3 tools/benchmark.py --manifest /tmp/corpus.json --root benchmarks/cache --satsolv /tmp/combo/build/satsolv --drat-trim /tmp/drat-trim-bin --time-limit 15 --verification-time-limit 180 --memory-gib 4 --output benchmarks/results/normalized-majority-combo.json
      - name: Report
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmarks/results/normalized-majority-combo.json').read_text())
          if not d['certification']['passed']: raise SystemExit(d['certification']['violations'])
          print(d['summary']['satsolv'])
          for r in d['rows']:
            x=r['solvers']['satsolv']; print(r['instance'],x['result'],round(x['elapsed'],3),x.get('verified'))
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: normalized-majority-combo-evidence
          path: benchmarks/results/normalized-majority-combo.json
          if-no-files-found: error
